# .pre-commit-config.yaml
# Run code-quality checks before every commit.

repos:
  # --------------------------------------------------
  # 1. Ruff — fast linter and formatter
  #    Local hooks, so they run the ruff pinned in uv.lock — the one CI uses.
  #    Bump ruff in pyproject.toml/uv.lock; there is no hook rev to keep in sync.
  #    --force-exclude is required: pre-commit passes explicit filenames, which
  #    ruff would otherwise check even when [tool.ruff.format] excludes them.
  # --------------------------------------------------
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude
        args: [--fix]
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

  # --------------------------------------------------
  # 2. uv hooks
  # --------------------------------------------------
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.9
    hooks:
      - id: uv-lock

  # --------------------------------------------------
  # 3. Documentation hook (numpydoc-validation)
  #    Moved to .pre-commit-config-doc.yaml — too demanding for every commit.
  #    The Format CI runs it on pull requests instead. (docformatter was dropped:
  #    it conflicts with ruff format on blank lines after module docstrings.)
  # --------------------------------------------------

  # --------------------------------------------------
  # 4. Maintenance hooks (whitespace, yaml, EOF)
  # --------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude_types: [svg]
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: check-added-large-files

  # --------------------------------------------------
  # 5. Custom hooks
  # --------------------------------------------------
  - repo: local
    hooks:
      - id: check-math-blocks
        name: check math blocks fit myst-nb
        entry: hooks/check_math.sh
        language: script
        files: ^examples/.*\.py$

      - id: check-notebook-titles
        name: check notebooks contains exactly 1 top level title
        language: system
        files: ^examples/.*\.py$
        entry: hooks/check_titles.sh

      - id: format-examples
        name: format examples as notebooks
        language: script
        files: ^examples/.*\.py$
        entry: hooks/format_notebooks.sh
