name: Setup uv
description: Install uv with Python 3.13 and export shared environment variables for the rest of the job.

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: "3.13"

    # A composite action's top-level `env:` is not exported to the caller,
    # so we write to $GITHUB_ENV instead.
    - name: Export shared environment
      shell: bash
      run: |
        echo "UV_NO_SYNC=1" >> "$GITHUB_ENV"
        echo "PY_COLORS=1" >> "$GITHUB_ENV"
