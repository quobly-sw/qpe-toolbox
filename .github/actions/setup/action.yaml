name: Setup uv
description: Install uv with Python 3.13 and enable UV_NO_SYNC for the rest of the job.

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: "3.13"

    # Persist to the job so every later `uv run` behaves as `--no-sync`.
    # A composite action's top-level `env:` is not exported to the caller,
    # so we write to $GITHUB_ENV instead.
    - name: Enable UV_NO_SYNC
      shell: bash
      run: echo "UV_NO_SYNC=1" >> "$GITHUB_ENV"
