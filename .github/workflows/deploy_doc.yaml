name: Deploy documentation

on:
  schedule:
    # run every Monday at 6am UTC
    #- cron: '0 6 * * 1'
    - cron: '0 15 * * 3'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Update mirrors
      run: sudo apt update

    - name: Install LaTeX
      run: |
        sudo apt install -y texlive-base texlive-latex-base texlive-latex-extra\
          texlive-fonts-recommended cm-super dvipng

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: "3.13"

    - name: Install the project
      run: uv sync --locked --group docs

    - name: Run examples
      run: |
        export TQDM_DISABLE=1
        uv run jupytext examples/*py --to ../docs/source/customapi/tutorials//ipynb --execute --run-path examples

    - name: Copy figures
      run: cp -r examples/figures docs/source/customapi/tutorials

    - name: Build doc
      run: uv run sphinx-build -b html -W docs/source docs/build

    - name: Upload doc
      id: deployment
      uses: actions/upload-pages-artifact@v4
      with:
        path: docs/build

  deploy:
    needs: build

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Specify runner + deployment step
    runs-on: ubuntu-slim
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
