name: Format

on: [pull_request]

jobs:
  ruff-format:
    runs-on: ubuntu-slim
    env:
      UV_NO_SYNC: 1  # avoid auto sync in nested uv run calls
    steps:
    - uses: actions/checkout@v6

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: "3.13"

    - name: Install the project
      run: uv sync --locked --only-group={jupytext,lint}

    - name: format src
      run: uv run ruff format --check

    # use pre-commit as task runner to get clean pass/fail status
    - name: format notebooks
      run: uv run pre-commit run format-examples --all-files
