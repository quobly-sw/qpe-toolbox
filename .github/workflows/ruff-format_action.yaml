name: Format

on: [pull_request]

jobs:
  ruff-format:
    runs-on: ubuntu-slim
    steps:
    - uses: actions/checkout@v6

    - uses: ./.github/actions/setup

    - name: Install the project
      run: uv sync --locked --only-group={jupytext,lint}

    - name: format src
      run: uv run ruff format --check

    - name: format notebooks
      run: hooks/format_notebooks.sh
