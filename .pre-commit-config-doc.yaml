# Documentation hook — run in CI on pull requests only, NOT on every commit.
# It lives outside .pre-commit-config.yaml so `pre-commit` on `git commit` does
# not run it; the Format CI invokes this file with
# `pre-commit run -c .pre-commit-config-doc.yaml --all-files`.

repos:
  - repo: https://github.com/numpy/numpydoc
    rev: v1.10.0
    hooks:
      - id: numpydoc-validation
